<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <h1>ERG PRO</h1>
      <h1>Apontamento de Horas</h1>
      <p>Bem-vindo, faça login para acessar o sistema</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Usuário</mat-label>
        <input matInput placeholder="Digite seu usuário" formControlName="login" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Senha</mat-label>
        <input matInput [type]="hide ? 'password' : 'text'" placeholder="Digite sua senha" formControlName="password" />
        <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
          <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>

      <button mat-raised-button color="primary" class="login-button">Login</button>
    </form>

    <div *ngIf="errorMessage" class="error-message" style="color: red;">
      {{ errorMessage }}
    </div>

    <div class="footer-text">
      <p>Esqueceu sua senha? Contacte o administrador do sistema</p>
    </div>
  </div>
</div>
