<mat-card>
  <div class="search-container">
    <mat-form-field class="form-field-left">
      <input
        matInput
        (keyup)="applyFilter($any($event.target).value)"
        placeholder="Pesquisar Permissão"
      />
    </mat-form-field>
  </div>
  <div class="mat-elevation-z5">
    <table mat-table [dataSource]="permissoes">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="httpmethod">
        <th mat-header-cell *matHeaderCellDef>HttpMethod</th>
        <td mat-cell *matCellDef="let row">{{ row.httpMethod }}</td>
      </ng-container>

      <ng-container matColumnDef="urlpattern">
        <th mat-header-cell *matHeaderCellDef>UrlPattern</th>
        <td mat-cell *matCellDef="let row">{{ row.urlPattern }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let row">{{ row.role }}</td>
      </ng-container>


      <!--Action Colum-->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let row">
          <a routerLink="/permissoes/update/{{ row.id }}">
            <i class="material-icons edit">edit</i>
          </a>
          <a routerLink="/permissoes/delete/{{ row.id }}">
            <i class="material-icons delete">delete</i>
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</mat-card>
