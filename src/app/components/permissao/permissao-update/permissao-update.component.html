<mat-card>
  <mat-card-title class="titulo">Atualizar Permissão</mat-card-title>
  <form>
    <div class="form-row">
      <mat-form-field>
        <input
          matInput
          placeholder="httpmethod"
          [(ngModel)]="permissoes.httpMethod"
          name="httpmethod"
        />
      </mat-form-field>
      <mat-form-field>
        <input
          matInput
          placeholder="Urlpattern"
          [(ngModel)]="permissoes.urlPattern"
          name="urlpattern"
        />
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field>
        <mat-select
          placeholder="Roles"
          [(ngModel)]="permissoes.role"
          name="roles"
        >
          <mat-option *ngFor="let roles of rolesList" [value]="roles">{{
            roles
          }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </form>

  <div class="button-container">
    <button mat-raised-button (click)="updatePermissoes()">Salvar</button>

    <button mat-raised-button (click)="cancelPermissao()">Cancelar</button>
  </div>
</mat-card>
