<mat-card>
  <mat-card-title class="titulo">Alterar Usuário</mat-card-title>
  <form>
    <div class="form-row">
      <mat-form-field>
        <input
          matInput
          placeholder="Digite nome do usuário"
          [(ngModel)]="usuarios.login"
          name="login"
        />
      </mat-form-field>
      <mat-form-field>
        <input
          matInput
          placeholder="Password"
          [(ngModel)]="usuarios.password"
          name="password"
        />
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field>
        <mat-select
          placeholder="Roles"
          [(ngModel)]="usuarios.role"
          name="status"
        >
          <mat-option *ngFor="let roles of rolesList" [value]="roles">{{
            roles
          }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </form>

  <div class="button-container">
    <button mat-raised-button (click)="updateUsuario()">Salvar</button>

    <button mat-raised-button (click)="cancelUsuario()">Cancelar</button>
  </div>
</mat-card>
