<mat-card>
  <div class="search-container">
    <mat-form-field class="form-field-left">
      <input
        matInput
        (keyup)="applyFilter($any($event.target).value)"
        placeholder="Pesquisar empresas"
      />
    </mat-form-field>
  </div>
  <div class="mat-elevation-z5">
    <table mat-table [dataSource]="empresas">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let row">{{ row.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="cnpj">
        <th mat-header-cell *matHeaderCellDef>CNPJ</th>
        <td mat-cell *matCellDef="let row">{{ formatCnpj(row.cnpj) }}</td>
      </ng-container>

      <ng-container matColumnDef="tel1">
        <th mat-header-cell *matHeaderCellDef>Telefone</th>
        <td mat-cell *matCellDef="let row">{{ formatTelefone(row.tel1) }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>

      <ng-container matColumnDef="uf">
        <th mat-header-cell *matHeaderCellDef>UF</th>
        <td mat-cell *matCellDef="let row">{{ row.uf }}</td>
      </ng-container>

      <ng-container matColumnDef="statusEmpresa">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let row">{{ row.statusEmpresa }}</td>
      </ng-container>

      <!--Action Colum-->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let row">
          <a routerLink="/app/empresas/update/{{ row.id }}">
            <i class="material-icons edit">edit</i>
          </a>
          <a routerLink="/app/empresas/delete/{{ row.id }}">
            <i class="material-icons delete">delete</i>
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</mat-card>
